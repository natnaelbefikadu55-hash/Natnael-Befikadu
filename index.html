<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nice Bingo Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #0088cc; }
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            max-width: 350px;
            margin: 20px auto;
        }
        .cell {
            background: white;
            border: 2px solid #0088cc;
            border-radius: 8px;
            padding: 15px 0;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            user-select: none;
        }
        .cell.marked {
            background: #2abb67;
            color: white;
            border-color: #2abb67;
        }
        button {
            background: #0088cc;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover { background: #006699; }
    </style>
</head>
<body>
    <h1>🎯 Bingo Game</h1>
    <p>ቁጥሮቹን በመንካት ይመዝግቡ!</p>
    
    <div class="grid" id="bingoBoard"></div>
    <button onclick="generateBoard()">አዲስ ጨዋታ ጀምር</button>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        function generateBoard() {
            const board = document.getElementById('bingoBoard');
            board.innerHTML = '';
            let numbers = Array.from({length: 75}, (_, i) => i + 1);
            numbers.sort(() => Math.random() - 0.5);
            
            for (let i = 0; i < 25; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                if (i === 12) {
                    cell.innerText = 'FREE';
                    cell.classList.add('marked');
                } else {
                    cell.innerText = numbers[i];
                    cell.onclick = function() {
                        this.classList.toggle('marked');
                    };
                }
                board.appendChild(cell);
            }
        }

        generateBoard();
    </script>
</body>
</html>
