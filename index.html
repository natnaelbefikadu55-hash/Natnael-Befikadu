<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nice Bingo - Multiplayer</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #0f172a; color: #ffffff; text-align: center; padding: 10px; }
    
    .top-bar { display: flex; justify-content: space-between; background: #1e293b; padding: 10px; border-radius: 10px; margin-bottom: 10px; }
    .balance-box { font-size: 14px; text-align: left; }
    .balance-val { color: #38bdf8; font-weight: bold; }

    .jackpot-card { background: linear-gradient(135deg, #1e1b4b, #312e81); border: 2px solid #f59e0b; border-radius: 12px; padding: 15px; margin-bottom: 12px; }
    .jackpot-title { color: #f59e0b; font-size: 14px; }
    .jackpot-amount { font-size: 26px; font-weight: bold; color: #fff; margin: 5px 0; }
    .timer { font-size: 20px; color: #ef4444; font-weight: bold; }

    .drawn-box { background: #1e293b; border: 1px solid #3b82f6; border-radius: 10px; padding: 10px; margin-bottom: 10px; }
    .current-num { font-size: 32px; font-weight: bold; color: #10b981; }
    .history-list { font-size: 12px; color: #94a3b8; margin-top: 5px; word-wrap: break-word; }

    .grid-container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; max-height: 280px; overflow-y: auto; padding: 5px; }
    .card-btn { background: #334155; border: 1px solid #475569; color: white; padding: 12px 0; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .card-btn.selected { background: #10b981; border-color: #059669; }

    .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #1e293b; padding: 12px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #334155; }
    .play-btn { background: #f59e0b; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; color: #000; cursor: pointer; }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; padding: 20px; }
    .modal-card { background: #1e293b; border: 2px solid #f59e0b; padding: 25px; border-radius: 15px; text-align: center; width: 90%; max-width: 320px; }
  </style>
</head>
<body>

  <div class="modal-overlay" id="noticeModal">
    <div class="modal-card">
      <h2 id="modalTitle" style="color: #f59e0b; margin-bottom: 10px;">ማስታወቂያ</h2>
      <p id="modalMsg" style="font-size: 16px; color: #fff; margin-bottom: 20px;">--</p>
      <button onclick="closeModal()" style="background: #f59e0b; border: none; padding: 10px 25px; border-radius: 8px; font-weight: bold; cursor: pointer;">እሺ</button>
    </div>
  </div>

  <div class="top-bar">
    <div class="balance-box">
      <div>ጨዋታ ሂሳብ: <span class="balance-val">0.00 ETB</span></div>
    </div>
    <div style="font-weight: bold; color: #f59e0b;">Nice Bingo</div>
  </div>

  <div class="jackpot-card">
    <div class="jackpot-title">ደራሽ (Jackpot)</div>
    <div class="jackpot-amount" id="jackpot">1,000 ETB</div>
    <div>ሁኔታ: <span class="timer" id="timer">00:30</span></div>
  </div>

  <div class="drawn-box">
    <div style="font-size: 12px; color: #38bdf8;">የወጣው ቁጥር</div>
    <div class="current-num" id="currentNum">--</div>
    <div class="history-list" id="historyList">ያለፉት: -</div>
  </div>

  <h3>ካርቴላ ይምረጡ (10 ብር)</h3>
  <br>
  <div class="grid-container" id="cardGrid"></div>

  <div class="bottom-bar">
    <div>የመረጡት: <span id="selectedCount" style="color: #10b981; font-weight: bold;">0</span>/4</div>
    <button class="play-btn" onclick="claimBingo()">ቢንጎ (BINGO)</button>
  </div>

  <script>
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();

    const socket = io("https://nice-bingo-api.onrender.com");

    const timerElement = document.getElementById('timer');
    const jackpotElement = document.getElementById('jackpot');
    const currentNumElem = document.getElementById('currentNum');
    const historyListElem = document.getElementById('historyList');

    function showNotice(title, msg) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalMsg').innerText = msg;
      document.getElementById('noticeModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('noticeModal').style.display = 'none';
    }

    socket.on('timer_update', (data) => {
      if (data.timer > 0) {
        timerElement.innerText = `00:${data.timer < 10 ? '0' : ''}${data.timer}`;
      } else {
        timerElement.innerText = "ጨዋታው ላይ ነው!";
      }
      if (data.jackpot) {
        jackpotElement.innerText = `${data.jackpot.toLocaleString()} ETB`;
      }
    });

    socket.on('number_drawn', (data) => {
      timerElement.innerText = "ቁጥር እየወጣ ነው...";
      currentNumElem.innerText = data.number;
      historyListElem.innerText = "ያለፉት: " + data.history.join(', ');
    });

    socket.on('game_reset', (data) => {
      currentNumElem.innerText = "--";
      historyListElem.innerText = "ያለፉት: -";
    });

    socket.on('game_over', (data) => {
      currentNumElem.innerText = "አበቃ!";
      showNotice("🏁 ጨዋታው ተጠናቋል", data.message);
    });

    socket.on('bingo_announced', (data) => {
      showNotice("🎉 BINGO!", data.message);
    });

    function claimBingo() {
      if (selectedCards.length === 0) {
        showNotice("ማስጠንቀቂያ", "እባክዎን አስቀድመው ካርቴላ ይምረጡ!");
        return;
      }
      socket.emit('claim_bingo', { cardId: selectedCards[0] });
    }

    const grid = document.getElementById('cardGrid');
    let selectedCards = [];

    for (let i = 1; i <= 600; i++) {
      const btn = document.createElement('button');
      btn.className = 'card-btn';
      btn.innerText = i;
      btn.onclick = () => selectCard(i, btn);
      grid.appendChild(btn);
    }

    function selectCard(num, btn) {
      if (selectedCards.includes(num)) {
        selectedCards = selectedCards.filter(c => c !== num);
        btn.classList.remove('selected');
      } else {
        if (selectedCards.length < 4) {
          selectedCards.push(num);
          btn.classList.add('selected');
        }
      }
      document.getElementById('selectedCount').innerText = selectedCards.length;
    }
  </script>
</body>
  </html>
