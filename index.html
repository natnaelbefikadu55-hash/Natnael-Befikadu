<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nice Bingo Game - 600 Cartelas</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f2f5;
            margin: 0;
            padding: 15px;
        }
        h1 { color: #0088cc; margin-bottom: 5px; }
        .controls {
            margin: 15px 0;
            display: flex;
            justify-content: center;
            gap: 10px;
            align-items: center;
        }
        input[type="number"] {
            width: 80px;
            padding: 8px;
            font-size: 16px;
            border: 2px solid #0088cc;
            border-radius: 6px;
            text-align: center;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            max-width: 350px;
            margin: 15px auto;
        }
        .cell {
            background: white;
            border: 2px solid #0088cc;
            border-radius: 8px;
            padding: 12px 0;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            user-select: none;
        }
        .cell.marked {
            background: #2abb67;
            color: white;
            border-color: #2abb67;
        }
        button {
            background: #0088cc;
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover { background: #006699; }
        .info { font-weight: bold; color: #333; margin-top: 5px; }
    </style>
</head>
<body>
    <h1>🎯 Bingo Game</h1>
    <div class="controls">
        <label for="cartelaNum">ካርቴላ #:</label>
        <input type="number" id="cartelaNum" min="1" max="600" value="1">
        <button onclick="loadCartela()">ክፈት</button>
    </div>
    
    <div class="info" id="cartelaTitle">ካርቴላ ቁጥር 1</div>
    <div class="grid" id="bingoBoard"></div>
    <button onclick="nextCartela()">ቀጣይ ካርቴላ ➡️</button>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        // Pseudo-random number generator algorithm using Cartela ID as seed
        function seededRandom(seed) {
            let x = Math.sin(seed++) * 10000;
            return x - Math.floor(x);
        }

        function generateNumbersForCartela(cartelaId) {
            let seed = cartelaId * 100;
            let numbers = [];
            let pool = Array.from({length: 75}, (_, i) => i + 1);
            
            for (let i = 0; i < 25; i++) {
                let randomIndex = Math.floor(seededRandom(seed++) * pool.length);
                numbers.push(pool[randomIndex]);
                pool.splice(randomIndex, 1);
            }
            return numbers;
        }

        function renderBoard(cartelaId) {
            const board = document.getElementById('bingoBoard');
            const title = document.getElementById('cartelaTitle');
            document.getElementById('cartelaNum').value = cartelaId;
            title.innerText = `ካርቴላ ቁጥር ${cartelaId}`;
            board.innerHTML = '';

            let numbers = generateNumbersForCartela(cartelaId);
            
            for (let i = 0; i < 25; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                if (i === 12) {
                    cell.innerText = 'FREE';
                    cell.classList.add('marked');
                } else {
                    cell.innerText = numbers[i];
                    cell.onclick = function() {
                        this.classList.toggle('marked');
                    };
                }
                board.appendChild(cell);
            }
        }

        function loadCartela() {
            let num = parseInt(document.getElementById('cartelaNum').value);
            if (num >= 1 && num <= 600) {
                renderBoard(num);
            } else {
                alert('እባክዎን ከ 1 እስከ 600 ያለ ቁጥር ያስገቡ!');
            }
        }

        function nextCartela() {
            let num = parseInt(document.getElementById('cartelaNum').value);
            if (num < 600) {
                renderBoard(num + 1);
            } else {
                renderBoard(1);
            }
        }

        renderBoard(1);
    </script>
</body>
</html>
